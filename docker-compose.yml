services:
  mongo:
    image: mongo:7.0
    container_name: trustgo_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: trustgo_db
    volumes:
      - mongo_data:/data/db
    networks:
      - trustgo_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: trustgo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trustgo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trustgo_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost
      MONGODB_URI: mongodb://mongo:27017/trustgo_db
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-trustgo_prod_jwt_secret_min_32_characters_here!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-trustgo_prod_jwt_refresh_secret_min_32_chars!}
      COOKIE_SECRET: ${COOKIE_SECRET:-trustgo_prod_cookie_secret_key_secure_32chars!}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trustgo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trustgo_client
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - trustgo_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: trustgo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - trustgo_network

networks:
  trustgo_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
