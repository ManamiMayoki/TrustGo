services:
  mongo:
    image: mongo:7.0
    container_name: trustgo_mongo_dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: trustgo_db
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - trustgo_dev_network

  redis:
    image: redis:7.2-alpine
    container_name: trustgo_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - trustgo_dev_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dependencies
    container_name: trustgo_server_dev
    command: npm run dev
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/trustgo_db
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: trustgo_access_jwt_secret_dev_32char_key_min!
      JWT_REFRESH_SECRET: trustgo_refresh_jwt_secret_dev_32char_key_min!
      COOKIE_SECRET: trustgo_cookie_secret_dev_key_secure_32chars!
    depends_on:
      - mongo
      - redis
    networks:
      - trustgo_dev_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: build
    container_name: trustgo_client_dev
    command: npm run dev -- --host
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - server
    networks:
      - trustgo_dev_network

networks:
  trustgo_dev_network:
    driver: bridge

volumes:
  mongo_dev_data:
  redis_dev_data:
